<script>
    document.addEventListener("DOMContentLoaded", function() {
        const toggleButton = document.getElementById('theme-toggle');
        
        // 1. فحص التفضيل المحفوظ في المتصفح وتطبيقه فوراً عند فتح الصفحة
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            toggleButton.innerHTML = '🌙'; // إجبار الزر على التحول لقمر
            toggleButton.style.background = '#333333';
        } else {
            document.body.classList.remove('dark-mode');
            toggleButton.innerHTML = '☀️'; // إجبار الزر على التحول لشمس
            toggleButton.style.background = '#ffffff';
        }

        // 2. حدث الضغط على الزر للتبديل الفوري بين الشمس والقمر
        toggleButton.addEventListener('click', function() {
            document.body.classList.toggle('dark-mode');
            
            if (document.body.classList.contains('dark-mode')) {
                toggleButton.innerHTML = '🌙'; // تحويل الأيقونة لقمر عند تفعيل الوضع الداكن
                toggleButton.style.background = '#333333';
                localStorage.setItem('theme', 'dark');
            } else {
                toggleButton.innerHTML = '☀️'; // تحويل الأيقونة لشمس عند تفعيل الوضع الفاتح
                toggleButton.style.background = '#ffffff';
                localStorage.setItem('theme', 'light');
            }
        });
    });
</script>
